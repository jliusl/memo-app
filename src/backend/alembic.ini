[alembic]
# %(here)s so the CLI works from any working directory, not just src/backend.
script_location = %(here)s/alembic
prepend_sys_path = %(here)s
path_separator = os

# Deliberately empty. env.py derives the URL from the app settings, which is what makes
# `ENV=test uv run alembic upgrade head` migrate memo_test rather than memo_dev. An
# explicit value here overrides that, which is how the test suite pins the test database.
sqlalchemy.url =

[loggers]
keys = root,sqlalchemy,alembic

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level = WARNING
handlers = console
qualname =

[logger_sqlalchemy]
level = WARNING
handlers =
qualname = sqlalchemy.engine

[logger_alembic]
level = INFO
handlers =
qualname = alembic

[handler_console]
class = StreamHandler
args = (sys.stderr,)
level = NOTSET
formatter = generic

[formatter_generic]
format = %(levelname)-5.5s [%(name)s] %(message)s
datefmt = %H:%M:%S
