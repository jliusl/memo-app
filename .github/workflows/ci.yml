name: CI

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]

# Both jobs talk to a real Postgres. The API tests run the actual migrations, and the
# browser tests drive the app against the same API - nothing here is mocked, so a green run
# means the two halves work together rather than only in isolation.
#
# ENV=test is what registers POST /api/__test__/reset, without which neither suite can get
# a known starting state. See docs/adr/0001.
env:
  ENV: test
  SECRET_KEY: ci-only-not-a-real-secret
  POSTGRES_USER: memo
  POSTGRES_PASSWORD: memo
  POSTGRES_HOST: localhost
  POSTGRES_PORT: '5432'
  POSTGRES_DB: memo_dev
  POSTGRES_TEST_DB: memo_test

jobs:
  api-tests:
    name: API tests
    runs-on: ubuntu-latest
    timeout-minutes: 20
    services:
      # Keep this in step with docker-compose.yml: the app's defaults already point at
      # these credentials, so changing one without the other fails as a connection error.
      postgres:
        image: postgres:17
        env:
          POSTGRES_USER: memo
          POSTGRES_PASSWORD: memo
          POSTGRES_DB: memo_dev
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U memo -d memo_dev"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    steps:
      - uses: actions/checkout@v4

      # The same script docker-compose mounts, so the test database cannot come out
      # different locally and here.
      - name: Create the test database
        # ON_ERROR_STOP, because psql otherwise reports success for a script whose
        # statements all failed, and the failure would surface later as a missing database.
        run: psql -v ON_ERROR_STOP=1 -f docker/initdb/01-create-test-db.sql
        env:
          PGHOST: localhost
          PGUSER: memo
          PGPASSWORD: memo
          PGDATABASE: memo_dev

      # uv's own installer rather than astral-sh/setup-uv. Both are documented; this one
      # cannot be wrong about a version tag, which matters because this workflow was
      # written with no network access to check which action majors currently exist. The
      # cost is that action's dependency cache - swap to it if you would rather have it.
      - name: Install uv
        run: |
          curl -LsSf https://astral.sh/uv/install.sh | sh
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"

      - name: Install the backend dependencies
        working-directory: src/backend
        run: uv sync --frozen

      - name: Lint
        working-directory: src/backend
        run: |
          uv run ruff format --check .
          uv run ruff check .

      - name: Apply the migrations
        working-directory: src/backend
        run: uv run alembic upgrade head

      # A migration that no longer describes the models is the failure this catches: it is
      # invisible locally, where the database was built by the migration it disagrees with.
      - name: Fail if the models and the migration have drifted apart
        working-directory: src/backend
        run: |
          uv run alembic revision --autogenerate -m "drift check"
          if [ -n "$(git status --porcelain alembic/)" ]; then
            echo "::error::The models and the migration disagree. Commit the generated migration."
            git status --short alembic/
            exit 1
          fi

      - name: Run the API tests
        working-directory: src/backend
        run: uv run pytest

  e2e:
    name: Browser tests
    runs-on: ubuntu-latest
    timeout-minutes: 30
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_USER: memo
          POSTGRES_PASSWORD: memo
          POSTGRES_DB: memo_dev
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U memo -d memo_dev"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    steps:
      - uses: actions/checkout@v4

      - name: Create the test database
        # ON_ERROR_STOP, because psql otherwise reports success for a script whose
        # statements all failed, and the failure would surface later as a missing database.
        run: psql -v ON_ERROR_STOP=1 -f docker/initdb/01-create-test-db.sql
        env:
          PGHOST: localhost
          PGUSER: memo
          PGPASSWORD: memo
          PGDATABASE: memo_dev

      # See the note in api-tests for why this is the installer rather than an action.
      - name: Install uv
        run: |
          curl -LsSf https://astral.sh/uv/install.sh | sh
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"

      # playwright.config.ts starts the backend itself, with `uv run uvicorn`.
      - name: Install the backend dependencies
        working-directory: src/backend
        run: uv sync --frozen

      - name: Apply the migrations
        working-directory: src/backend
        run: uv run alembic upgrade head

      - uses: actions/setup-node@v4
        with:
          node-version: lts/*
          cache: npm
          cache-dependency-path: |
            package-lock.json
            src/frontend/package-lock.json

      - name: Install the browser-test dependencies
        run: npm ci

      - name: Install the frontend dependencies
        working-directory: src/frontend
        run: npm ci

      - name: Install the browsers
        run: npx playwright install --with-deps

      - name: Run the browser tests
        run: npx playwright test

      - name: Upload the report
        uses: actions/upload-artifact@v4
        if: ${{ !cancelled() }}
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 30
