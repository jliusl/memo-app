name: "Copilot Setup Steps"

on:
  workflow_dispatch:
  push:
    paths:
      - .github/workflows/copilot-setup-steps.yml
  pull_request:
    paths:
      - .github/workflows/copilot-setup-steps.yml

jobs:
  copilot-setup-steps:
    runs-on: ubuntu-latest

    permissions:
      contents: read

    steps:
    - uses: actions/checkout@v6

    - uses: actions/setup-node@v6
      with:
        node-version: lts/*

    - name: Install the browser-test dependencies
      run: npm ci

    - name: Install the browsers
      run: npx playwright install --with-deps

    - name: Install the frontend dependencies
      working-directory: src/frontend
      run: npm ci

    - name: Install uv
      run: |
        curl -LsSf https://astral.sh/uv/install.sh | sh
        echo "$HOME/.local/bin" >> "$GITHUB_PATH"

    # The backend, and Postgres. Neither is started here - CI does that - but an agent
    # picking up this workspace can then run the tests without installing anything first.
    - name: Install the backend dependencies
      working-directory: src/backend
      run: uv sync --frozen

    # Was `npx run build`, which is not a command. This is the build the browser tests
    # depend on, so it is also the one worth failing early on.
    - name: Build the frontend
      working-directory: src/frontend
      run: npm run build
